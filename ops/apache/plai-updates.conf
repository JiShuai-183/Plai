# Plai 独立更新源：在全站 ProxyPass / 之前排除本路径，避免经过 my-app。
# 该文件放入宝塔 Apache 的 proxy include 目录，并以 00- 前缀保证优先级。
<IfModule mod_proxy.c>
    ProxyPass /downloads/plai/ !
</IfModule>

Alias /downloads/plai/ "/www/wwwroot/resource/data/plai-updates/"

<Directory "/www/wwwroot/resource/data/plai-updates">
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>

<Location "/downloads/plai/latest.json">
    Header always set Cache-Control "no-cache, no-store, must-revalidate"
    Header always set X-Content-Type-Options "nosniff"
    ForceType application/json
</Location>

<LocationMatch "^/downloads/plai/releases/">
    Header always set Cache-Control "public, max-age=31536000, immutable"
    Header always set X-Content-Type-Options "nosniff"
</LocationMatch>
